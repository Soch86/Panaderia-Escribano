"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"c4491153-e346-4cab-8e5a-2027a98921ee\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<script src=\"https://accounts.google.com/gsi/client\" async=\"\" defer=\"\"><\u002Fscript>\n<script src=\"0411d903-d690-42be-bf5b-c5bd75d06ebf\"><\u002Fscript>\n<script src=\"de731df4-2ef9-4b53-8143-9f9fee93448c\"><\u002Fscript>\n<script>window.PlainScreen=function(p){return React.createElement('div',{style:{height:'100dvh',width:'100%',overflow:'hidden'}},p.children)};\nif(window.__PWA__){document.title='Panadería Escribano';var H=document.head,add=function(t,a){var e=document.createElement(t);for(var k in a)e.setAttribute(k,a[k]);H.appendChild(e)};\nadd('meta',{name:'viewport',content:'width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'});add('meta',{name:'theme-color',content:'#E4185C'});add('meta',{name:'apple-mobile-web-app-capable',content:'yes'});add('meta',{name:'mobile-web-app-capable',content:'yes'});add('meta',{name:'apple-mobile-web-app-status-bar-style',content:'black-translucent'});add('meta',{name:'apple-mobile-web-app-title',content:'Escribano'});add('link',{rel:'manifest',href:'manifest.webmanifest'});add('link',{rel:'apple-touch-icon',href:'icon-180.png'});\nif('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});}<\u002Fscript>\n<style>\nbody{margin:0;background:#EFE6DA;font-family:-apple-system,\"SF Pro\",system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#E4185C}a:hover{color:#B8104A}\ninput{font-family:inherit}\ninput::placeholder{color:#B8A9AE}\n<\u002Fstyle>\n<\u002Fhelmet>\n<img src=\"c150b4c7-41e7-4e25-987c-27b69c750c5f\" alt=\"\" id=\"logo-src\" style=\"display:none\">\n<div style=\"min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:{{ wrapPad }};box-sizing:border-box\">\n<x-import component-from-global-scope=\"PlainScreen\" hint-size=\"100%,100%\">\n<div style=\"height:100%;display:flex;flex-direction:column;background:#FBF5EE;font-family:-apple-system,'SF Pro',system-ui,sans-serif;color:#2B1A21\">\n  <sc-if value=\"{{ entornoPruebas }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#8A5F00;color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;text-align:center;padding:6px 12px;flex-shrink:0\">ENTORNO DE PRUEBAS · NO SON DATOS REALES<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== LOGIN ===== -->\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;background:#E4185C\">\n      <img src=\"c150b4c7-41e7-4e25-987c-27b69c750c5f\" alt=\"Panadería Escribano\" style=\"width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.8);box-shadow:0 12px 30px rgba(0,0,0,.2)\">\n      <div style=\"color:#fff;font-size:28px;font-weight:800;margin-top:24px;line-height:1.1\">Panadería Escribano<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.8);font-size:16px;margin-top:8px;line-height:1.4\">Albaranes de reparto, guardados en tu Google.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:28px 24px {{ botPad }};background:#FBF5EE\">\n      <button sc-camel-on-click=\"{{ loginGoogle }}\" style=\"width:100%;height:60px;border-radius:18px;border:1.5px solid #E8DCD0;background:#fff;color:#2B1A21;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 4px 14px rgba(43,26,33,.08)\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 48 48\"><path fill=\"#EA4335\" d=\"M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z\"><\u002Fpath><path fill=\"#4285F4\" d=\"M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4 or:#9C8A91;margin-top:8px;line-height:1.4\">Sello <span style=\"font-family:ui-monospace,monospace\">{{ facturaSel.huellaCorta }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px\">\n        <button sc-camel-on-click=\"{{ enviarWhatsApp }}\" style=\"height:60px;border-radius:16px;border:0;background:#25D366;color:#fff;font-size:14px;font-weight:800;cursor:pointer\">WhatsApp<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ enviarEmail }}\" style=\"height:60px;border-radius:16px;border:0;background:{{ bgEmail }};color:#fff;font-size:14px;font-weight:800;cursor:pointer\">{{ labelEmail }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ descargarFactura }}\" style=\"height:60px;border-radius:16px;border:0;background:#2B1A21;color:#fff;font-size:14px;font-weight:800;cursor:pointer\">Descargar PDF<\u002Fbutton>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ borrarFactura }}\" style=\"margin-top:10px;width:100%;height:48px;border-radius:18px;border:0;background:transparent;color:#C8102E;font-size:15px;font-weight:700;cursor:pointer\">Borrar este albarán<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <!-- ===== MÁS ===== -->\n    <sc-if value=\"{{ isMasMenu }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border-radius:18px;overflow:hidden\">\n        <button sc-camel-on-click=\"{{ irProductos }}\" style=\"width:100%;display:flex;align-items:center;gap:12px;padding:0 16px;min-height:60px;border:0;background:transparent;text-align:left;cursor:pointer;border-bottom:1px solid #F1E8DE;font-family:inherit\"><div style=\"flex:1;font-size:17px;font-weight:700;color:#2B1A21\">Productos y precios<\u002Fdiv><div style=\"color:#C9B8BE;font-size:20px\">›<\u002Fdiv><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ irRepartidores }}\" style=\"width:100%;display:flex;align-items:center;gap:12px;padding:0 16px;min-height:60px;border:0;background:transparent;text-align:left;cursor:pointer;border-bottom:1px solid #F1E8DE;font-family:inherit\"><div style=\"flex:1;font-size:17px;font-weight:700;color:#2B1A21\">Repartidores<\u002Fdiv><div style=\"font-size:14px;color:#7A646C;font-weight:600\">{{ repActivoNombre }}<\u002Fdiv><div style=\"color:#C9B8BE;font-size:20px\">›<\u002Fdiv><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ irResumen }}\" style=\"width:100%;display:flex;align-items:center;gap:12px;padding:0 16px;min-height:60px;border:0;background:transparent;text-align:left;cursor:pointer;border-bottom:1px solid #F1E8DE;font-family:inherit\"><div style=\"flex:1;font-size:17px;font-weight:700;color:#2B1A21\">Resumen de ventas<\u002Fdiv><div style=\"color:#C9B8BE;font-size:20px\">›<\u002Fdiv><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ irEmpresa }}\" style=\"width:100%;display:flex;align-items:center;gap:12px;padding:0 16px;min-height:60px;border:0;background:transparent;text-align:left;cursor:pointer;font-family:inherit\"><div style=\"flex:1;font-size:17px;font-weight:700;color:#2B1A21\">Mis datos fiscales<\u002Fdiv><div style=\"color:#C9B8BE;font-size:20px\">›<\u002Fdiv><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;background:#fff;border-radius:18px;padding:16px\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><div style=\"width:44px;height:44px;border-radius:50%;background:#4285F4;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px\">{{ user.inicial }}<\u002Fdiv><div style=\"flex:1;min-width:0\"><div style=\"font-size:16px;font-weight:800\">{{ user.nombre }}<\u002Fdiv><div style=\"font-size:13px;color:#7A646C\">{{ user.email }}<\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:{{ conexionColor }}\"><div style=\"width:8px;height:8px;border-radius:50%;background:{{ conexionColor }}\"><\u002Fdiv>{{ conexionTxt }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-top:14px;border-top:1px solid #F1E8DE;padding-top:12px;display:flex;flex-direction:column;gap:10px;font-size:14px\">\n          <div style=\"display:flex;justify-content:space-between;gap:8px\"><span style=\"color:#7A646C\">Carpeta Drive<\u002Fspan><b>{{ nombreCarpeta }}<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:8px\"><span style=\"color:#7A646C\">Subidas a Drive<\u002Fspan><b>{{ numEnDrive }} de {{ numFacturasTotal }} · {{ subidasTxt }}<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:8px\"><span style=\"color:#7A646C\">Copias marcadas COBRADO<\u002Fspan><b>{{ numCobradas }}<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:8px\"><span style=\"color:#7A646C\">Hoja de cálculo<\u002Fspan><b>{{ nombreHojaTxt }}<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:8px\"><span style=\"color:#7A646C\">Envío por email<\u002Fspan><b>Gmail<\u002Fb><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:8px\"><span style=\"color:#7A646C\">Última sincronización<\u002Fspan><b style=\"color:#1E9E5A\">{{ syncLabel }}<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:14px\">\n          <button sc-camel-on-click=\"{{ abrirDrive }}\" style=\"flex:1;height:48px;border-radius:14px;border:0;background:#4285F4;color:#fff;font-size:15px;font-weight:700;cursor:pointer\">Abrir en Drive<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ copiaAhora }}\" style=\"flex:1;height:48px;border-radius:14px;border:1.5px solid #E8DCD0;background:#FBF5EE;color:#2B1A21;font-size:15px;font-weight:700;cursor:pointer\">{{ copiaLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ haySyncMsg }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:10px;font-size:13px;font-weight:700;color:#4285F4;text-align:center;line-height:1.4\">{{ syncMsg }}<\u002Fdiv><\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ rehacerDrive }}\" style=\"margin-top:10px;width:100%;height:44px;border-radius:14px;border:1.5px solid #E8DCD0;background:#FBF5EE;color:#2B1A21;font-size:14px;font-weight:700;cursor:pointer\">Volver a subir las facturas que falten<\u002Fbutton>\n        <div style=\"margin-top:14px;padding-top:12px;border-top:1px solid #F1E8DE\">\n          <div style=\"font-size:15px;font-weight:800\">Si la hoja está vacía o descuadrada<\u002Fdiv>\n          <div style=\"font-size:13px;color:#7A646C;margin-top:4px;line-height:1.45\">Reconstruye la hoja con los datos de este móvil ({{ lineasEnMovil }} líneas). Se te preguntará antes, y al terminar te dice cuántas líneas han quedado escritas.<\u002Fdiv>\n          <sc-if value=\"{{ hayAvisoHoja }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;background:#FFF4E5;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:#8A5F00;line-height:1.4\">{{ avisoHojaTxt }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ reconstruirHoja }}\" style=\"margin-top:12px;width:100%;height:48px;border-radius:14px;border:1.5px solid #F2C4D3;background:#FFF5F8;color:#C8102E;font-size:15px;font-weight:800;cursor:pointer\">Reconstruir la hoja desde el móvil<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ hojaNueva }}\" style=\"margin-top:8px;width:100%;height:48px;border-radius:14px;border:1.5px solid #E8DCD0;background:#FBF5EE;color:#2B1A21;font-size:15px;font-weight:700;cursor:pointer\">Empezar una hoja nueva<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid #F1E8DE;font-size:12px;color:#7A646C;line-height:1.5\">\n          <div style=\"font-weight:700;color:#2B1A21\">Estado de la sesión<\u002Fdiv>\n          <div>{{ diagToken }}<\u002Fdiv>\n          <div>{{ diagLinea }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ logout }}\" style=\"margin-top:10px;width:100%;height:44px;border-radius:14px;border:0;background:transparent;color:#C8102E;font-size:14px;font-weight:700;cursor:pointer\">Cerrar sesión<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;background:#fff;border-radius:18px;padding:16px\">\n        <div style=\"font-size:17px;font-weight:800\">Empezar de cero<\u002Fdiv>\n        <div style=\"font-size:14px;color:#7A646C;margin-top:4px;line-height:1.45\">Borra del móvil todos los clientes y documentos y vuelve a empezar la numeración en 1. Lo que ya esté en Google no se toca.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ empezarCero }}\" style=\"margin-top:12px;width:100%;height:48px;border-radius:14px;border:1.5px solid #F2C4D3;background:#FFF5F8;color:#C8102E;font-size:15px;font-weight:800;cursor:pointer\">Borrar todo y empezar de cero<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== CÓMO MANDARLO POR WHATSAPP ===== -->\n    <sc-if value=\"{{ hayWaSel }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;inset:0;background:rgba(43,26,33,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:16px\">\n        <div style=\"width:100%;max-width:460px;background:#EFE6DA;border-radius:24px;padding:22px 18px 18px\">\n          <div style=\"font-size:22px;font-weight:800;color:#2B1A21;line-height:1.15\">Mandar por WhatsApp a {{ waCliente }}<\u002Fdiv>\n          <div style=\"font-size:14px;color:#7A646C;margin-top:8px;line-height:1.45\">WhatsApp no deja hacer las dos cosas a la vez. Elige:<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ waConPdf }}\" style=\"margin-top:14px;width:100%;min-height:66px;border-radius:18px;border:0;background:#25D366;color:#fff;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;padding:12px 16px;text-align:left\">\n            Con el PDF adjunto\n            <div style=\"font-size:13px;font-weight:600;opacity:.9;margin-top:3px\">Eliges el contacto dentro de WhatsApp · solo desde el móvil<\u002Fdiv>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ waChat }}\" style=\"margin-top:10px;width:100%;min-height:66px;border-radius:18px;border:1.5px solid #E8DCD0;background:#fff;color:#2B1A21;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;padding:12px 16px;text-align:left\">\n            {{ waTelTxt }}\n            <div style=\"font-size:13px;font-weight:600;color:#7A646C;margin-top:3px\">Mensaje ya escrito; el PDF se descarga para adjuntarlo<\u002Fdiv>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ waCerrar }}\" style=\"margin-top:10px;width:100%;height:48px;border-radius:14px;border:0;background:transparent;color:#7A646C;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit\">Cancelar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== ¿QUIÉN USA ESTE MÓVIL? ===== -->\n    <sc-if value=\"{{ preguntarQuien }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;inset:0;background:rgba(43,26,33,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:16px\">\n        <div style=\"width:100%;max-width:460px;background:#EFE6DA;border-radius:24px;padding:22px 18px 18px\">\n          <div style=\"font-size:24px;font-weight:800;color:#2B1A21;line-height:1.15\">¿Quién usa este móvil?<\u002Fdiv>\n          <div style=\"font-size:15px;color:#7A646C;margin-top:8px;line-height:1.45\">Se queda guardado en este teléfono. Todas tus entregas irán con tu nombre.<\u002Fdiv>\n          <div style=\"margin-top:16px;background:#fff;border-radius:18px;overflow:hidden\">\n            <sc-for list=\"{{ quienLista }}\" as=\"q\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ q.elegir }}\" style=\"width:100%;display:flex;align-items:center;gap:12px;padding:0 16px;min-height:68px;border:0;background:transparent;text-align:left;cursor:pointer;border-bottom:1px solid #F1E8DE;font-family:inherit\">\n                <div style=\"width:44px;height:44px;border-radius:50%;background:#FBE3EB;color:#E4185C;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0\">{{ q.inicial }}<\u002Fdiv>\n                <div style=\"flex:1;font-size:19px;font-weight:800;color:#2B1A21\">{{ q.nombre }}<\u002Fdiv>\n                <div style=\"color:#C9B8BE;font-size:22px\">›<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== REPARTIDORES ===== -->\n    <sc-if value=\"{{ isRepartidores }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:15px;color:#7A646C;font-weight:600;margin:0 4px 12px;line-height:1.45\">Quien esté marcado es quien usa <b>este<\u002Fb> móvil: se queda guardado y todas sus entregas van con su nombre. Si repartís con varios teléfonos, entrad en todos con la misma cuenta de Google de la panadería.<\u002Fdiv>\n      <div style=\"background:#fff;border-radius:18px;overflow:hidden\">\n        <sc-for list=\"{{ repartidoresLista }}\" as=\"r\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;align-items:stretch;border-bottom:1px solid #F1E8DE;background:{{ r.bg }}\">\n            <button sc-camel-on-click=\"{{ r.elegir }}\" style=\"flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 8px 12px 16px;border:0;background:transparent;text-align:left;cursor:pointer;font-family:inherit\">\n              <div style=\"width:40px;height:40px;border-radius:50%;background:#fff;color:#E4185C;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0\">{{ r.inicial }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0\"><div style=\"font-size:17px;font-weight:800;color:{{ r.fg }}\">{{ r.nombre }}<\u002Fdiv><div style=\"font-size:13px;color:#7A646C\">{{ r.resumen }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:800;color:{{ r.fg }}\">{{ r.marca }}<\u002Fdiv>\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ r.borrar }}\" style=\"width:52px;flex-shrink:0;border:0;border-left:1px solid #F1E8DE;background:transparent;cursor:pointer;font-size:18px;color:#C9B8BE;font-family:inherit\">×<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;background:#fff;border-radius:18px;padding:16px\">\n        <div style=\"font-size:13px;font-weight:700;color:#7A646C;margin-bottom:6px\">Añadir repartidor<\u002Fdiv>\n        <div style=\"display:flex;gap:10px\">\n          <input value=\"{{ nr.nombre }}\" sc-camel-on-change=\"{{ setNr.nombre }}\" placeholder=\"Nombre\" style=\"flex:1;min-width:0;height:52px;border-radius:14px;border:1.5px solid #E8DCD0;background:#FBF5EE;color:#2B1A21;font-size:17px;padding:0 14px;box-sizing:border-box\">\n          <button sc-camel-on-click=\"{{ addRepartidor }}\" style=\"width:96px;height:52px;border-radius:14px;border:0;background:#E4185C;color:#fff;font-size:16px;font-weight:800;cursor:pointer\">Añadir<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ nrError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:10px;color:#C8102E;font-weight:700;font-size:14px\">Escribe el nombre.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== PRODUCTOS ===== -->\n    <sc-if value=\"{{ isProductos }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ abrirNuevoProducto }}\" style=\"width:100%;height:56px;border-radius:18px;border:0;background:#E4185C;color:#fff;font-size:17px;font-weight:800;cursor:pointer\">+ Añadir producto<\u002Fbutton>\n      <div style=\"margin-top:14px;background:#fff;border-radius:18px;overflow:hidden\">\n        <sc-for list=\"{{ productosLista }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px;border-bottom:1px solid #F1E8DE\">\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:17px;font-weight:700\">{{ p.nombre }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:{{ p.ivaColor }};font-weight:600;margin-top:2px\">{{ p.ivaTxt }}<\u002Fdiv>\n              <sc-raw-select value=\"{{ p.ivaVal }}\" sc-camel-on-change=\"{{ p.setIva }}\" style=\"margin-top:8px;height:44px;border-radius:12px;border:1.5px solid #E8DCD0;background:#FBF5EE;color:#2B1A21;font-size:15px;font-weight:700;padding:0 8px\">\n                <option value=\"\">IVA sin asignar<\u002Foption>\n                <sc-for list=\"{{ ivaOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">IVA {{ o.t }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:6px\">\n              <div style=\"display:flex;align-items:center;gap:6px\"><input value=\"{{ p.precioEdit }}\" sc-camel-on-change=\"{{ p.setPrecio }}\" sc-camel-input-mode=\"decimal\" style=\"width:76px;height:44px;border-radius:12px;border:1.5px solid #E8DCD0;text-align:right;padding:0 10px;font-size:18px;font-weight:700;background:#FBF5EE;color:#2B1A21\"><span style=\"font-size:15px;font-weight:700;width:36px\">{{ p.udSufijo }}<\u002Fspan><\u002Fdiv>\n              <sc-raw-select value=\"{{ p.udVal }}\" sc-camel-on-change=\"{{ p.setUd }}\" style=\"height:40px;border-radius:12px;border:1.5px solid #E8DCD0;background:#FBF5EE;color:#2B1A21;font-size:14px;font-weight:700;padding:0 6px\"><option value=\"ud\">por unidad<\u002Foption><option value=\"kg\">por kilo<\u002Foption><\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ p.borrar }}\" style=\"width:44px;height:44px;border-radius:12px;border:0;background:#FBE3EB;color:#C8102E;font-size:20px;cursor:pointer\">×<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#7A646C;margin:12px 4px;line-height:1.45\">Toca el precio o el tipo de IVA para cambiarlo. Se aplica a las próximas entregas: los albaranes ya hechos no se mueven.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ formProducto }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px\">\n        <label style=\"display:block\"><div style=\"font-size:13px;font-weight:700;color:#7A646C;margin-bottom:6px\">Nombre *<\u002Fdiv><input value=\"{{ np.nombre }}\" sc-camel-on-change=\"{{ setNp.nombre }}\" placeholder=\"Barra de pan\" style=\"width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1.5px solid #E8DCD0;padding:0 14px;font-size:18px;background:#FBF5EE;color:#2B1A21\"><\u002Flabel>\n        <label style=\"display:block\"><div style=\"font-size:13px;font-weight:700;color:#7A646C;margin-bottom:6px\">¿Cómo se vende? *<\u002Fdiv>\n          <sc-raw-select value=\"{{ np.ud }}\" sc-camel-on-change=\"{{ setNp.ud }}\" style=\"width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1.5px solid #E8DCD0;padding:0 12px;font-size:18px;background:#FBF5EE;color:#2B1A21\">\n            <option value=\"ud\">Por unidad (barras, piezas)<\u002Foption>\n            <option value=\"kg\">Por kilo (a peso)<\u002Foption>\n          <\u002Fsc-raw-select><\u002Flabel>\n        <label style=\"display:block\"><div style=\"font-size:13px;font-weight:700;color:#7A646C;margin-bottom:6px\">Precio de venta al cliente *<\u002Fdiv><input value=\"{{ np.precio }}\" sc-camel-on-change=\"{{ setNp.precio }}\" placeholder=\"1,10\" sc-camel-input-mode=\"decimal\" style=\"width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1.5px solid #E8DCD0;padding:0 14px;font-size:18px;background:#FBF5EE;color:#2B1A21\"><div style=\"font-size:12px;color:#7A646C;margin-top:6px\">{{ criterioTxt }}<\u002Fdiv><\u002Flabel>\n        <label style=\"display:block\"><div style=\"font-size:13px;font-weight:700;color:#7A646C;margin-bottom:6px\">Tipo de IVA * <span style=\"font-weight:600;color:#9C8A91\">— lo dice tu gestoría<\u002Fspan><\u002Fdiv>\n          <sc-raw-select value=\"{{ np.iva }}\" sc-camel-on-change=\"{{ setNp.iva }}\" style=\"width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1.5px solid #E8DCD0;padding:0 12px;font-size:18px;background:#FBF5EE;color:#2B1A21\">\n            <option value=\"\">Elige el tipo<\u002Foption>\n            <sc-for list=\"{{ ivaOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select><\u002Flabel>\n      <\u002Fdiv>\n      <sc-if value=\"{{ npError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:12px;color:#C8102E;font-weight:700;font-size:15px\">Falta el nombre, el precio o el tipo de IVA.<\u002Fdiv><\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ guardarProducto }}\" style=\"margin-top:16px;width:100%;height:60px;border-radius:18px;border:0;background:#E4185C;color:#fff;font-size:18px;font-weight:800;cursor:pointer\">Guardar producto<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <!-- ===== RESUMEN ===== -->\n    <sc-if value=\"{{ isResumen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"font-size:15px;color:#7A646C;font-weight:600\">{{ mesActual }}<\u002Fdiv><div style=\"font-size:13px;font-weight:700;color:{{ tendColor }}\">{{ tendencia }}<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px\">\n        <div style=\"background:#fff;border-radius:18px;padding:16px\"><div style=\"font-size:13px;color:#7A646C;font-weight:600\">Vendido<\u002Fdiv><div style=\"font-size:26px;font-weight:800;margin-top:4px\">{{ ventasMes }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:18px;padding:16px\"><div style=\"font-size:13px;color:#7A646C;font-weight:600\">Cobrado<\u002Fdiv><div style=\"font-size:26px;font-weight:800;margin-top:4px;color:#1E9E5A\">{{ cobradoMes }}<\u002Fdiv><div style=\"font-size:12px;color:#7A646C;margin-top:2px\">{{ pctCobrado }} del total<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:18px;padding:16px\"><div style=\"font-size:13px;color:#7A646C;font-weight:600\">Pendiente de cobro<\u002Fdiv><div style=\"font-size:22px;font-weight:800;margin-top:4px;color:#D97706\">{{ pendienteMes }}<\u002Fdiv><div style=\"font-size:12px;color:#7A646C;margin-top:2px\">{{ numPendientes }} facturas<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:18px;padding:16px\"><div style=\"font-size:13px;color:#7A646C;font-weight:600\">Ticket medio<\u002Fdiv><div style=\"font-size:22px;font-weight:800;margin-top:4px\">{{ ticketMedio }}<\u002Fdiv><div style=\"font-size:12px;color:#7A646C;margin-top:2px\">{{ numEntregasMes }} entregas<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:18px;padding:16px\"><div style=\"font-size:13px;color:#7A646C;font-weight:600\">Media diaria<\u002Fdiv><div style=\"font-size:22px;font-weight:800;margin-top:4px\">{{ mediaDiaria }}<\u002Fdiv><div style=\"font-size:12px;color:#7A646C;margin-top:2px\">{{ diasActivos }} días con reparto<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:18px;padding:16px\"><div style=\"font-size:13px;color:#7A646C;font-weight:600\">Unidades<\u002Fdiv><div style=\"font-size:22px;font-weight:800;margin-top:4px\">{{ unidadesMes }}<\u002Fdiv><div style=\"font-size:12px;color:#7A646C;margin-top:2px\">{{ clientesActivos }} clientes activos<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;font-size:18px;font-weight:800\">Últimos 7 días<\u002Fdiv>\n      <div style=\"margin-top:10px;background:#fff;border-radius:18px;padding:16px 16px 10px;display:flex;align-items:flex-end;gap:8px;height:120px;box-sizing:border-box\">\n        <sc-for list=\"{{ dias7 }}\" as=\"d\" hint-placeholder-count=\"7\">\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end\"><div style=\"font-size:10px;color:#7A646C;font-weight:700\">{{ d.valor }}<\u002Fdiv><div style=\"width:100%;border-radius:6px 6px 2px 2px;background:{{ d.color }};height:{{ d.h }}\"><\u002Fdiv><div style=\"font-size:11px;color:#7A646C;font-weight:700;text-transform:capitalize\">{{ d.label }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hayMorosos }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:22px;font-size:18px;font-weight:800\">Cobros atrasados<\u002Fdiv>\n        <div style=\"margin-top:10px;background:#FFF4E5;border-radius:18px;overflow:hidden\">\n          <sc-for list=\"{{ morosos }}\" as=\"m\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #F5E3C8\"><div style=\"flex:1\"><div style=\"font-size:15px;font-weight:700\">{{ m.nombre }}<\u002Fdiv><div style=\"font-size:13px;color:#A15C00\">{{ m.detalle }}<\u002Fdiv><\u002Fdiv><div style=\"font-size:17px;font-weight:800;color:#D97706\">{{ m.debe }}<\u002Fdiv><button sc-camel-on-click=\"{{ m.recordar }}\" style=\"height:40px;padding:0 12px;border-radius:12px;border:0;background:#25D366;color:#fff;font-size:13px;font-weight:800;cursor:pointer\">Recordar<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"margin-top:22px;font-size:18px;font-weight:800\">Por cliente<\u002Fdiv>\n      <div style=\"margin-top:10px;background:#fff;border-radius:18px;padding:6px 16px\">\n        <sc-for list=\"{{ porCliente }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"padding:10px 0;border-bottom:1px solid #F1E8DE\">\n            <div style=\"display:flex;justify-content:space-between;font-size:15px;font-weight:700\"><span>{{ r.nombre }}<\u002Fspan><span>{{ r.total }}<\u002Fspan><\u002Fdiv>\n            <div style=\"height:8px;border-radius:4px;background:#F3EAE0;margin-top:6px;overflow:hidden\"><div style=\"height:100%;background:#E4185C;border-radius:4px;width:{{ r.pct }}\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;font-size:18px;font-weight:800\">Por producto<\u002Fdiv>\n      <div style=\"margin-top:10px;background:#fff;border-radius:18px;padding:6px 16px\">\n        <sc-for list=\"{{ porProducto }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F1E8DE;font-size:15px\"><span style=\"font-weight:700\">{{ r.nombre }}<\u002Fspan><span style=\"color:#7A646C\">{{ r.unidades }} uds · <b style=\"color:#2B1A21\">{{ r.total }}<\u002Fb><\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;background:#fff;border-radius:18px;padding:16px\">\n        <div style=\"font-size:17px;font-weight:800\">Cuadro de mando en Google Sheets<\u002Fdiv>\n        <div style=\"font-size:14px;color:#7A646C;margin-top:4px;line-height:1.45\">Hoja \"{{ nombreHojaTxt }}\" en tu Drive con pestañas: Cuadro de mando (KPIs del año y del mes con gráficos), Ventas, Clientes, Productos, Cobros pendientes y Sello de integridad. Se actualiza con cada entrega.<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:14px\">\n          <button sc-camel-on-click=\"{{ abrirSheet }}\" style=\"flex:1;height:48px;border-radius:14px;border:0;background:#1E9E5A;color:#fff;font-size:15px;font-weight:700;cursor:pointer\">Abrir hoja<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ exportarExcel }}\" style=\"flex:1;height:48px;border-radius:14px;border:1.5px solid #E8DCD0;background:#FBF5EE;color:#2B1A21;font-size:15px;font-weight:700;cursor:pointer\">Descargar Excel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== EMPRESA ===== -->\n    <sc-if value=\"{{ isEmpresa }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px\">\n        <label style=\"display:block\"><div style=\"font-size:13px;font-weight:700;color:#7A646C;margin-bottom:6px\">Nombre / Razón social<\u002Fdiv><input value=\"{{ empresa.nombre }}\" sc-camel-on-change=\"{{ setEmp.nombre }}\" style=\"width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1.5px solid #E8DCD0;padding:0 14px;font-size:18px;background:#FBF5EE;color:#2B1A21\"><\u002Flabel>\n        <label style=\"display:block\"><div style=\"font-size:13px;font-weight:700;color:#7A646C;margin-bottom:6px\">NIF<\u002Fdiv><input value=\"{{ empresa.nif }}\" sc-camel-on-change=\"{{ setEmp.nif }}\" style=\"width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1.5px solid #E8DCD0;padding:0 14px;font-size:18px;background:#FBF5EE;color:#2B1A21\"><\u002Flabel>\n        <label style=\"display:block\"><div style=\"font-size:13px;font-weight:700;color:#7A646C;margin-bottom:6px\">Dirección<\u002Fdiv><input value=\"{{ empresa.direccion }}\" sc-camel-on-change=\"{{ setEmp.direccion }}\" style=\"width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1.5px solid #E8DCD0;padding:0 14px;font-size:18px;background:#FBF5EE;color:#2B1A21\"><\u002Flabel>\n        <label style=\"display:block\"><div style=\"font-size:13px;font-weight:700;color:#7A646C;margin-bottom:6px\">Los precios que escribo son<\u002Fdiv>\n          <sc-raw-select value=\"{{ criterioVal }}\" sc-camel-on-change=\"{{ setCriterio }}\" style=\"width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1.5px solid #E8DCD0;padding:0 12px;font-size:18px;background:#FBF5EE;color:#2B1A21\">\n            <option value=\"si\">Con IVA incluido<\u002Foption>\n            <option value=\"no\">Sin IVA<\u002Foption>\n          <\u002Fsc-raw-select><\u002Flabel>\n        <label style=\"display:block\"><div style=\"font-size:13px;font-weight:700;color:#7A646C;margin-bottom:6px\">Serie de albaranes<\u002Fdiv><input value=\"{{ serieEmpresa }}\" sc-camel-on-change=\"{{ setEmp.serie }}\" placeholder=\"F\" style=\"width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1.5px solid #E8DCD0;padding:0 14px;font-size:18px;background:#FBF5EE;color:#2B1A21\"><\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#7A646C;margin:12px 4px;line-height:1.45\">Estos datos salen en todas las facturas. Se guardan solos. La numeración es {{ ejemploNum }} y es correlativa e irrepetible, como exige Hacienda.<\u002Fdiv>\n      <div style=\"margin-top:14px;background:#fff;border-radius:18px;padding:16px\">\n        <div style=\"font-size:17px;font-weight:800\">Sello de integridad<\u002Fdiv>\n        <div style=\"font-size:14px;color:#7A646C;margin-top:4px;line-height:1.45\">Cada documento lleva una huella enlazada con la del anterior. Sirve para demostrar que no se ha modificado si un cliente discute una entrega. Es un sello interno tuyo, no tiene nada que ver con Hacienda.<\u002Fdiv>\n        <div style=\"font-size:13px;color:#7A646C;margin-top:10px;line-height:1.4\">Esta app no emite facturas: lleva el reparto y te prepara el resumen del mes para que tu programa de facturación emita la factura.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- Barra inferior -->\n  <div style=\"flex-shrink:0;display:flex;background:#fff;border-top:1px solid #EFE4D8;padding:8px 6px {{ botPad }}\">\n    <button sc-camel-on-click=\"{{ tabHoy }}\" style=\"flex:1;height:52px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{ colHoy }};font-family:inherit\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l9-8 9 8\"><\u002Fpath><path d=\"M5 10v10h14V10\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;font-weight:700\">Hoy<\u002Fspan><\u002Fbutton>\n    <button sc-camel-on-click=\"{{ irEntrega }}\" style=\"flex:1;height:52px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{ colEntrega }};font-family:inherit\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v8M8 12h8\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;font-weight:700\">Entrega<\u002Fspan><\u002Fbutton>\n    <button sc-camel-on-click=\"{{ tabClientes }}\" style=\"flex:1;height:52px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{ colClientes }};font-family:inherit\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M2.5 19c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6\"><\u002Fpath><circle cx=\"17\" cy=\"9\" r=\"2.5\"><\u002Fcircle><path d=\"M17 13.5c2.5 0 4.5 2 4.5 4.5\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;font-weight:700\">Clientes<\u002Fspan><\u002Fbutton>\n    <button sc-camel-on-click=\"{{ tabFacturas }}\" style=\"flex:1;height:52px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{ colFacturas }};font-family:inherit\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 3h9l4 4v14H6z\"><\u002Fpath><path d=\"M9 12h6M9 16h6\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;font-weight:700\">Albaranes<\u002Fspan><\u002Fbutton>\n    <button sc-camel-on-click=\"{{ tabMas }}\" style=\"flex:1;height:52px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{ colMas }};font-family:inherit\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"5\" cy=\"12\" r=\"1.6\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"1.6\"><\u002Fcircle><circle cx=\"19\" cy=\"12\" r=\"1.6\"><\u002Fcircle><\u002Fsvg><span style=\"font-size:11px;font-weight:700\">Más<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-import>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;ivaPan&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[4,10,21],&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Facturación&quot;},&quot;googleClientId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;111367010291-br48jpfkcml1lavc9d4d7vtp2n6qeeua.apps.googleusercontent.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Google&quot;},&quot;pwa&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Vista&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    const d = new Date(), day = (n) => { const x = new Date(d); x.setDate(d.getDate() - n); x.setHours(7, 30 + n * 7); return x.toISOString(); };\n    const seed = {\n      empresa: { nombre: 'Panadería Escribano', nif: '12345678A', direccion: 'C/ del Horno, 4 · Villanueva' },\n      products: [\n        { id: 'p1', nombre: 'Barra de pan', precio: 1.10 }, { id: 'p2', nombre: 'Chapata', precio: 1.50 },\n        { id: 'p3', nombre: 'Pan de pueblo', precio: 2.80 }, { id: 'p4', nombre: 'Bollos', precio: 0.80 }, { id: 'p5', nombre: 'Baguette', precio: 1.20 }],\n      clients: [\n        { id: 'c1', nombre: 'Bar Manolo', direccion: 'Plaza Mayor, 3', nif: 'B11223344', tel: '600111222', email: 'barmanolo@gmail.com', habitual: { p1: 20, p2: 6 } },\n        { id: 'c2', nombre: 'Restaurante La Plaza', direccion: 'C/ Real, 18', nif: 'B55667788', tel: '600333444', email: 'info@restaurantelaplaza.es', habitual: { p1: 30, p3: 4, p5: 10 } },\n        { id: 'c3', nombre: 'Casa Pepa', direccion: 'Camino Viejo, 7', nif: '22334455C', tel: '600555666', habitual: { p1: 8, p4: 12 } },\n        { id: 'c4', nombre: 'Ultramarinos Ruiz', direccion: 'C/ Ancha, 22', nif: 'B99887766', tel: '600777888', email: 'ultramarinosruiz@hotmail.com', habitual: { p1: 25, p2: 10, p3: 6 } },\n        { id: 'c5', nombre: 'Colegio San José', direccion: 'Av. Constitución, 40', nif: 'Q1234567H', tel: '600999000', habitual: { p4: 60, p1: 10 } }],\n      deliveries: [], next: 1, resumenes: [], nextR: 1,\n    };\n    seed.empresa.serie = 'A';\n    const mk = (cid, n, lineas, pagado) => { seed.deliveries.push({ id: 'd' + seed.next, num: 'A-' + String(seed.next).padStart(4, '0'), clienteId: cid, fecha: day(n), lineas, pagado }); seed.next++; };\n    for (let n = 4; n >= 1; n--) {\n      mk('c1', n, [{ p: 'p1', q: 20, pr: 1.10 }, { p: 'p2', q: 6, pr: 1.50 }], n > 1);\n      mk('c2', n, [{ p: 'p1', q: 30, pr: 1.10 }, { p: 'p3', q: 4, pr: 2.80 }, { p: 'p5', q: 10, pr: 1.20 }], true);\n      mk('c4', n, [{ p: 'p1', q: 25, pr: 1.10 }, { p: 'p2', q: 10, pr: 1.50 }, { p: 'p3', q: 6, pr: 2.80 }], n !== 2);\n      if (n !== 3) mk('c3', n, [{ p: 'p1', q: 8, pr: 1.10 }, { p: 'p4', q: 12, pr: 0.80 }], false);\n      if (n % 2 === 0) mk('c5', n, [{ p: 'p4', q: 60, pr: 0.80 }, { p: 'p1', q: 10, pr: 1.10 }], true);\n    }\n    mk('c2', 0, [{ p: 'p1', q: 30, pr: 1.10 }, { p: 'p3', q: 4, pr: 2.80 }, { p: 'p5', q: 10, pr: 1.20 }], true);\n    const pruebas = window.__ENTORNO__ === 'pruebas', kApp = 'escribano-app-v1' + (pruebas ? '-pruebas' : ''), kUser = 'escribano-user-v1' + (pruebas ? '-pruebas' : '');\n    let saved = null; try { saved = JSON.parse(localStorage.getItem(kApp)); } catch (e) {}\n    let user = null; try { user = JSON.parse(localStorage.getItem(kUser)); } catch (e) {}\n    this.state = { user, setupStep: -1, cola: saved?.cola || [], ultimaCopia: saved?.ultimaCopia || null, ultimaComprobacion: saved?.ultimaComprobacion || null, faltanDrive: saved?.faltanDrive || [], comprobando: false,\n      repartidores: saved?.repartidores || [{ id: 'r1', nombre: 'Yo' }], repActivo: saved?.repActivo || 'r1', ncPrecios: {}, editId: null, nr: {}, nrError: false, sesionPendiente: false, driveFolder: saved?.driveFolder || user?.driveFolder || null, lastSync: saved?.lastSync || null, token: null, syncing: false, syncMsg: null, driveFiles: {}, sheetId: null, tab: 'hoy', step: 'cliente', sel: null, qty: {}, facturaId: null, formCliente: false, formProducto: false, sub: null, nc: {}, ncQty: {}, np: {}, filtro: 'todas', filtroCliente: null, ncError: false, npError: false, copia: false,\n      // La app arranca VACÍA, en cualquier entorno: sin clientes, sin documentos,\n      // numeración en 1 y sin huellas heredadas. No hay datos de ejemplo.\n      ...(saved || { empresa: { nombre: seed.empresa.nombre, nif: '', direccion: '' }, products: seed.products, clients: [], deliveries: [], next: 1, nextR: 1, resumenes: [] }) };\n  }\n  componentDidMount() {\n    this.restaurarSiHaceFalta().then(() => {\n      this.reconciliarCola();\n      const q = this.quienSoy();\n      if (q && this.repartidor(q)) { if (this.state.repActivo !== q) this.setState({ repActivo: q }); }\n      else if (this.repartidores().length > 1) this.setState({ preguntarQuien: true });\n    });\n    try { navigator.storage?.persist?.().then(ok => { this._persistente = ok; this.forceUpdate(); }); } catch (e) {}\n    // La renovación NO se lanza por temporizador: un popup sin gesto lo bloquea siempre el navegador.\n    // Se intenta de forma oportunista en el PRIMER toque de cada sesión, donde sí está permitido.\n    this._primerGesto = async () => {\n      document.removeEventListener('pointerdown', this._primerGesto, true);\n      if (!this.state.user) return;\n      if (!this.token()) { const r = await this.renovarToken(); if (r.estado !== 'ok') return; }\n      this.revisarFormato();\n      if ((this.state.cola || []).length) await this.syncDrive({ silencio: true });\n      const faltan = await this.comprobarDrive();       // comprobación real, como mucho una vez al día\n      if (faltan) await this.syncDrive({ silencio: true });\n      this.copiaSemanal();\n    };\n    document.addEventListener('pointerdown', this._primerGesto, true);\n    // Al volver la red o la app al primer plano: vaciar cola SI ya hay token. Nunca abrir popup aquí.\n    this._despertar = () => {\n      if (!this.state.user || document.visibilityState !== 'visible') return;\n      if (this.token()) { if ((this.state.cola || []).length) this.syncDrive({ silencio: true }); }\n      else this.setState({ sesionPendiente: true });\n    };\n    window.addEventListener('online', this._despertar);\n    document.addEventListener('visibilitychange', this._despertar);\n  }\n  componentWillUnmount() { clearTimeout(this._reintento); document.removeEventListener('pointerdown', this._primerGesto, true); window.removeEventListener('online', this._despertar); document.removeEventListener('visibilitychange', this._despertar); }\n  saveUser(user) { this.setState({ user }); try { user ? localStorage.setItem(this.claveUser(), JSON.stringify(user)) : localStorage.removeItem(this.claveUser()); } catch (e) {} }\n  // Login: con googleClientId real usa Google Identity + Drive API; sin él simula el flujo.\n  loginGoogle() {\n    if (this.tokenClient()) {\n      this.pedirToken(false).then(async (r) => {\n        if (r.estado !== 'ok') { this.setState({ syncMsg: 'No se pudo entrar: ' + r.motivo }); return; }\n        this._diag = { ...(this._diag || {}), estado: 'ok', ms: undefined, resultado: 'login con pantalla de Google', ultimoIntento: new Date().toISOString() };\n        const me = await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + r.token } })).json();\n        this.runSetup({ nombre: me.name, email: me.email }, async () => await this.ensureFolder(this.carpetaDrive()), true);\n      });\n    } else this.runSetup({ nombre: 'Escribano', email: 'panaderia.escribano@gmail.com' }, async () => 'demo');\n  }\n  runSetup(user, crearCarpeta, real) {\n    const u = { ...user, inicial: (user.nombre || 'E')[0].toUpperCase() };\n    this.setState({ user: u, setupStep: 0 });\n    const paso = (n) => new Promise(r => setTimeout(() => { this.setState({ setupStep: n }); r(); }, 700));\n    (async () => { await paso(1); const folder = await crearCarpeta(); await paso(2); await paso(3); await paso(4);\n      setTimeout(() => this.saveUser({ ...u, driveFolder: folder }), 500); this.setState({ setupStep: -1, driveFolder: folder }); if (real) this.syncDrive(); })();\n  }\n  save(patch, andSync) {\n    this.setState(patch, () => {\n      const { empresa, products, clients, deliveries, next, driveFiles, driveFolder, sheetId, lastSync, resumenes, nextR, cola, ultimaCopia, ultimaComprobacion, faltanDrive, repartidores, repActivo } = this.state;\n      const datos = { empresa, products, clients, deliveries, next, driveFiles, driveFolder, sheetId, lastSync, resumenes, nextR, cola, ultimaCopia, ultimaComprobacion, faltanDrive, repartidores, repActivo, guardadoTs: Date.now() };\n      try { localStorage.setItem(this.claveApp(), JSON.stringify(datos)); } catch (e) {}\n      this.idbSet(this.claveApp(), datos);   // espejo en IndexedDB: sobrevive mejor a la purga de iOS\n      if (andSync) this.syncDrive({ silencio: true });\n    });\n  }\n  idb() { return new Promise((r) => { try { const q = indexedDB.open('escribano', 1); q.onupgradeneeded = () => { try { q.result.createObjectStore('kv'); } catch (e) {} }; q.onsuccess = () => r(q.result); q.onerror = () => r(null); } catch (e) { r(null); } }); }\n  async idbSet(k, v) { const db = await this.idb(); if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} }\n  async idbGet(k) { const db = await this.idb(); if (!db) return null; return new Promise((r) => { try { const rq = db.transaction('kv', 'readonly').objectStore('kv').get(k); rq.onsuccess = () => r(rq.result || null); rq.onerror = () => r(null); } catch (e) { r(null); } }); }\n  // Documentos que no tienen PDF registrado en Drive, y si la hoja está por detrás.\n  // Es la VERDAD, independiente de la cola: la cola puede quedarse vacía por un fallo.\n  faltaPorSubir() {\n    const s = this.state, files = s.driveFiles || {};\n    const sinPdf = s.deliveries.filter(d => !(typeof files[d.id] === 'string' ? files[d.id] : files[d.id]?.reg));\n    const ultimo = s.deliveries.length ? s.deliveries.reduce((a, d) => new Date(d.fecha) > new Date(a.fecha) ? d : a) : null;\n    const hojaVieja = s.deliveries.length > 0 && (!s.lastSync || (ultimo && new Date(s.lastSync) < new Date(ultimo.fecha)));\n    return { sinPdf, hojaVieja, nunca: !s.lastSync };\n  }\n  // Reconcilia la cola con la realidad: cubre los documentos que ya existían antes de esta versión\n  reconciliarCola() {\n    const { sinPdf, hojaVieja } = this.faltaPorSubir();\n    const ids = new Set(this.state.deliveries.map(d => d.id));\n    const antes = (this.state.cola || []).length;\n    // Fuera operaciones huérfanas (PDFs de documentos que ya no existen) y fuera duplicad / ══ Comprobación REAL contra Drive ══\n  // Lee lo que hay de verdad en la carpeta y lo compara con el registro local.\n  // Sin esto, \"Todo guardado\" es una creencia del móvil; con esto, es una comprobación.\n  async listar(parent, extra) {\n    const q = encodeURIComponent(`'${parent}' in parents and trashed=false` + (extra || ''));\n    const r = await this.gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&pageSize=1000&fields=files(id,name)`);\n    return r?.files || [];\n  }\n  async comprobarDrive(forzar) {\n    const s = this.state;\n    if (!this.token() || !s.driveFolder || s.driveFolder === 'demo' || s.comprobando) return null;\n    if (!forzar && s.ultimaComprobacion && Date.now() - new Date(s.ultimaComprobacion).getTime() < 864e5) return null;\n    this.setState({ comprobando: true });\n    try {\n      const fact = await this.ensureFolder('Facturas', s.driveFolder);\n      const nombres = new Set();\n      for (const año of await this.listar(fact, \" and mimeType='application/vnd.google-apps.folder'\")) {\n        for (const mes of await this.listar(año.id, \" and mimeType='application/vnd.google-apps.folder'\")) {\n          (await this.listar(mes.id)).forEach(f => nombres.add(f.name));\n        }\n      }\n      const faltan = s.deliveries.filter(d => { const fac = this.factura(d); return !nombres.has(`${fac.num.replace(/\\//g, '-')} - ${fac.cliente}.pdf`); }).map(d => d.id);\n      const files = { ...(s.driveFiles || {}) };\n      faltan.forEach(k => { delete files[k]; });          // el registro local mentía: se corrige\n      const cola = [...(s.cola || [])];\n      faltan.forEach(docId => { if (!cola.some(o => o.tipo === 'pdf' && o.docId === docId)) cola.push({ tipo: 'pdf', docId, intentos: 0, ts: new Date().toISOString(), error: null }); });\n      this.save({ driveFiles: files, cola, faltanDrive: faltan, ultimaComprobacion: new Date().toISOString(), comprobando: false });\n      return faltan.length;\n    } catch (e) { this.setState({ comprobando: false }); return null; }\n  }\n  // Copia de seguridad por correo, una vez a la semana: sobrevive a perder el móvil Y a que la hoja se estropee\n  async copiaSemanal() {\n    const s = this.state, email = s.user?.email; if (!email || !this.token()) return;\n    const ultima = s.ultimaCopia ? new Date(s.ultimaCopia) : null;\n    if (ultima && Date.now() - ultima.getTime() < 7 * 864e5) return;\n    const datos = { empresa: s.empresa, products: s.products, clients: s.clients, deliveries: s.deliveries, resumenes: s.resumenes || [], next: s.next, nextR: s.nextR || 1, generado: new Date().toISOString() };\n    const b64 = (t) => { const u = new TextEncoder().encode(t); let bin = ''; for (let i = 0; i < u.length; i += 8192) bin += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(bin); };\n    const nombre = `copia-escribano-${new Date().toISOString().slice(0, 10)}.json`, B = 'cop' + Date.now();\n    const cuerpo = `<div style=\"font-family:-apple-system,Arial,sans-serif;font-size:15px;color:#2B1A21;line-height:1.6\">Copia de seguridad de <b>${s.empresa.nombre}<\u002Fb>.<br>${s.clients.length} clientes · ${s.deliveries.length} documentos · ${s.products.length} productos.<br><br>Guarda este correo: con el fichero adjunto se puede recuperar todo si pierdes el móvil.<\u002Fdiv>`;\n    const mime = ['To: ' + email, 'Subject: =?UTF-8?B?' + b64('Copia de seguridad · ' + s.empresa.nombre) + '?=', 'MIME-Version: 1.0',\n      `Content-Type: multipart/mixed; boundary=${B}`, '', `--${B}`, 'Content-Type: text/html; charset=UTF-8', 'Content-Transfer-Encoding: base64', '', b64(cuerpo),\n      `--${B}`, `Content-Type: application/json; name=\"${nombre}\"`, `Content-Disposition: attachment; filename=\"${nombre}\"`, 'Content-Transfer-Encoding: base64', '', b64(JSON.stringify(datos)), `--${B}--`, ''].join('\\r\\n');\n    const raw = b64(mime).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, '');\n    const r = await this.gapi('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ raw }) }).catch(() => null);\n    if (r) this.save({ ultimaCopia: new Date().toISOString() });\n  }\n  // Vaciar la cola. Es el único camino de subida. Sin token no borra nada de la cola.\n  async syncDrive(opts) {\n    if (!this.token()) { this.setState({ sesionPendiente: true }); return; }\n    if (this.state.syncing) return;\n    this.reconciliarCola();\n    this.setState({ syncing: true, syncMsg: opts?.silencio ? null : 'Guardando en Google…' });\n    let cola = [...(this.state.cola || [])];\n    const files = {}; const prev = this.state.driveFiles || {};\n    Object.keys(prev).forEach(k => { files[k] = typeof prev[k] === 'string' ? { reg: prev[k] } : { ...prev[k] }; });\n    try {\n      const root = this.state.driveFolder && this.state.driveFolder !== 'demo' ? this.state.driveFolder : await this.ensureFolder(this.carpetaDrive());\n      if (!root) throw new Error('sin carpeta');\n      // 1) los PDF, que nunca destruyen nada\n      for (const op of cola.filter(o => o.tipo === 'pdf')) {\n        const d = this.state.deliveries.find(x => x.id === op.docId);\n        if (!d) { cola = cola.filter(o => o !== op); continue; }\n        try { const id = await this.subirPdf(d, root); if (id) { files[d.id] = { ...(files[d.id] || {}), reg: id }; cola = cola.filter(o => o !== op); } else throw new Error('sin id'); }\n        catch (e) { op.intentos++; op.error = String(e.message || e).slice(0, 120); }\n      }\n      // 2) la hoja, con su freno\n      if (cola.some(o => o.tipo === 'hoja')) {\n        const freno = opts?.forzar ? null : await this.frenoHoja();\n        if (freno) { this.save({ driveFolder: root, driveFiles: files, cola, syncing: false, avisoHoja: freno, syncMsg: null }); return; }\n        const sheetId = await this.construirHoja(root);\n        const escritas = sheetId ? await this.filasHoja(sheetId) : 0;\n        if (sheetId && escritas !== null && escritas < this.lineasLocales()) throw new Error(`la hoja quedó con ${escritas} de ${this.lineasLocales()} líneas`);\n        cola = cola.filter(o => o.tipo !== 'hoja');\n        this.save({ driveFolder: root, driveFiles: files, cola, sheetId: sheetId || this.state.sheetId, lastSync: new Date().toISOString(), syncing: false, avisoHoja: null, syncMsg: opts?.silencio ? null : 'Todo guardado en Google' });\n      } else {\n        this.save({ driveFolder: root, driveFiles: files, cola, lastSync: cola.length ? this.state.lastSync : new Date().toISOString(), syncing: false, syncMsg: opts?.silencio ? null : 'Todo guardado en Google' });\n      }\n      setTimeout(() => this.setState({ syncMsg: null }), 3000);\n      await this.comprobarDrive(true);                   // tras subir, se verifica de verdad\n      this.copiaSemanal();\n    } catch (e) {\n      this.save({ driveFiles: files, cola, syncing: false, syncMsg: opts?.silencio ? null : 'No se pudo guardar: ' + String(e.message || e).slice(0, 160) });\n    }\n  }\n  // Esta app NO expide facturas: los documentos son albaranes de entrega.\n  // La huella encadenada se mantiene como SELLO DE INTEGRIDAD interno, sin ninguna\n  // relación con VERI*FACTU ni con la AEAT. No hay modos ni interruptores.\n  esPruebas() { return window.__ENTORNO__ === 'pruebas'; }\n  claveApp() { return 'escribano-app-v1' + (this.esPruebas() ? '-pruebas' : ''); }\n  claveUser() { return 'escribano-user-v1' + (this.esPruebas() ? '-pruebas' : ''); }\n  carpetaDrive() { return 'Panadería Escribano · Facturas' + (this.esPruebas() ? ' (PRUEBAS)' : ''); }\n  nombreHoja() { return 'Control de ventas' + (this.esPruebas() ? ' (PRUEBAS)' : ''); }\n  cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }\n  fmt(n) { return n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }\n  fecha(iso) { return new Date(iso).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }); }\n  // ── IVA congelado en la línea ──\n  // Cada línea guarda: pr (precio tal como se teclea), iv (tipo vigente en ese momento, null si no\n  // había), ci (si ese precio llevaba IVA incluido). Los totales leen SIEMPRE la línea, nunca el\n  // producto: cambiar un tipo o el criterio de precios no mueve ni un albarán del pasado.\n  // Las líneas antiguas no tienen iv/ci: se leen como ci=true, iv=null → mismo importe que siempre.\n  ivaLinea(l) { return l.iv === null || l.iv === undefined ? null : Number(l.iv); }\n  conIvaLinea(l) { return l.ci === false ? false : true; }\n  brutoUnidad(l) { const iv = this.ivaLinea(l) || 0; return this.conIvaLinea(l) ? l.pr : l.pr * (1 + iv / 100); }\n  baseUnidad(l) { const iv = this.ivaLinea(l) || 0; return this.conIvaLinea(l) ? l.pr / (1 + iv / 100) : l.pr; }\n  total(d) { return d.lineas.reduce((s, l) => s + l.q * this.brutoUnidad(l), 0); }\n  // Subtotales de base y cuota agrupados por tipo: es lo que pide un programa de facturación\n  desgloseIva(lineas) {\n    const g = {};\n    lineas.forEach(l => { const iv = this.ivaLinea(l); const k = iv === null ? 'sin' : String(iv);\n      g[k] = g[k] || { tipo: iv, base: 0, bruto: 0 };\n      g[k].base += l.q * this.baseUnidad(l); g[k].bruto += l.q * this.brutoUnidad(l); });\n    return Object.values(g).map(x => ({ ...x, cuota: x.bruto - x.base })).sort((a, b) => (a.tipo ?? 99) - (b.tipo ?? 99));\n  }\n  // Precio que se le factura a ESTE cliente. Si tiene precio propio, manda el suyo; si no, el general.\n  // Serie de albaranes: nunca F, que es la serie reservada a facturas\n  // Un producto se vende por unidad (barras) o por kilo (a peso)\n  esKg(p) { return (p && p.ud) === 'kg'; }\n  udTxt(p) { return this.esKg(p) ? 'kg' : 'ud'; }\n  numQ(v) { const n = parseFloat(String(v).replace(',', '.').replace(/[^\\d.]/g, '')); return isNaN(n) ? 0 : n; }\n  qTxt(q, p) { return this.esKg(p) ? String(Number(q.toFixed(3))).replace('.', ',') + ' kg' : String(q); }\n  serieAlb() { const v = (this.state.empresa.serie || 'A').toUpperCase(); return v === 'F' ? 'A' : v; }\n  precioProd(clienteId, p) {\n    const v = this.cliente(clienteId)?.precios?.[p.id];\n    return (v === undefined || v === null || v === '') ? p.precio : Number(v);\n  }\n  tienePrecioPropio(clienteId, pid) { const v = this.cliente(clienteId)?.precios?.[pid]; return !(v === undefined || v === null || v === ''); }\n  repartidores() { return this.state.repartidores || []; }\n  repartidor(id) { return this.repartidores().find(r => r.id === id) || null; }\n  nombreRep(id) { return this.repartidor(id)?.nombre || '—'; }\n  preciosConIva() { return this.state.empresa.preciosConIva !== false; }\n  ivaOpciones() { return [0, 4, 10, 21]; }\n  precioBase(p) { const iv = p.iva === null || p.iva === undefined ? null : Number(p.iva); if (iv === null) return null; return this.preciosConIva() ? p.precio / (1 + iv / 100) : p.precio; }\n  precioBruto(p) { const iv = p.iva === null || p.iva === undefined ? null : Number(p.iva); if (iv === null) return null; return this.preciosConIva() ? p.precio : p.precio * (1 + iv / 100); }\n  esHoy(iso) { return new Date(iso).toDateString() === new Date().toDateString(); }\n  esMes(iso) { const a = new Date(iso), b = new Date(); return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear(); }\n  cliente(id) { return this.state.clients.find(c => c.id === id) || { nombre: '—' }; }\n  producto(id) { return this.state.products.find(p => p.id === id) || { nombre: '—' }; }\n  factura(d) {\n    if (!d) return {};\n    const c = this.cliente(d.clienteId), t = this.total(d);\n    return { id: d.id, num: d.num, cliente: c.nombre, nif: c.nif, direccion: c.direccion, tel: c.tel, email: c.email, fecha: this.fecha(d.fecha), pagado: d.pagado,\n      estado: d.pagado ? 'Cobrado' : 'Sin cobrar', estadoColor: d.pagado ? '#1E9E5A' : '#D97706',\n      repNombre: d.rep ? 'Lo llevó ' + this.nombreRep(d.rep) : '',\n      pasoEmitido: 'Emitido ' + this.fecha(d.fecha),\n      pasoDrive: (this.state.driveFiles || {})[d.id] ? 'Guardado en Google' : 'Sin guardar en Google todavía',\n      pasoDriveColor: (this.state.driveFiles || {})[d.id] ? '#1E9E5A' : '#D97706',\n      pasoEnviado: d.enviado ? `Enviado al cliente por ${d.enviado.via}` : 'Sin enviar al cliente',\n      pasoEnviadoColor: d.enviado ? '#1E9E5A' : '#7A646C',\n      btnPago: d.pagado ? 'Marcar como no cobrado' : 'Marcar como cobrado', btnPagoBg: d.pagado ? '#7A646C' : '#1E9E5A',\n      lineas: d.lineas.map(l => ({ qty: this.qTxt(l.q, this.producto(l.p)), nombre: this.producto(l.p).nombre, precio: this.fmt(this.brutoUnidad(l)), sub: this.fmt(l.q * this.brutoUnidad(l)) })),\n      total: this.fmt(t), totalNum: t, raw: d, desglose: this.desgloseIva(d.lineas),\n      huella: d.reg?.h || '', huellaCorta: d.reg?.h ? d.reg.h.slice(0, 16) : 'Sin registrar', regTs: d.reg?.ts ? new Date(d.reg.ts).toLocaleString('es-ES') : '', qr: '' };\n  }\n  // WhatsApp con el PDF adjunto (hoja de compartir del móvil); si no se puede, texto\n  // WhatsApp no permite las dos cosas a la vez: o adjuntas el PDF (y eliges el contacto\n  // en WhatsApp) o abres el chat del cliente ya cargado (y el PDF se adjunta a mano).\n  pedirViaWhatsApp(f, opts) { this.setState({ waSel: { f, opts: opts || null } }); }\n  compartirWhatsApp(f, opts) {\n    const texto = `Muy buenas, adjunto ${opts?.titulo === 'FACTURA PROFORMA' ? 'la factura proforma' : 'el albarán'} ${f.num}${opts?.periodo ? ' (' + opts.periodo + ')' : ''}. Total: ${f.total}. ¡Gracias!`;\n    try {\n      const doc = this.pdfFactura(f, opts), nombre = `${opts?.titulo === 'FACTURA PROFORMA' ? 'Proforma' : 'Albaran'}-${f.num.replace(/\\//g, '-')}.pdf`;\n      const file = new File([doc.output('blob')], nombre, { type: 'application/pdf' });\n      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], text: texto }).then(() => this.marcarEnviado(f.raw?.id, 'WhatsApp')).catch(() => {}); return; }\n      // Aquí no se puede adjuntar (WhatsApp Web, navegador de escritorio): se descarga el PDF\n      // y se dice con todas las letras, en vez de mandar un mensaje sin el documento.\n      doc.save(nombre);\n      this.setState({ syncMsg: 'Este navegador no puede adjuntar en WhatsApp. El PDF se ha descargado: abre el chat y adjúntalo con el clip. Desde el móvil se adjunta solo.' });\n      setTimeout(() => this.setState({ syncMsg: null }), 9000);\n      return;\n    } catch (e) {}\n    this.whatsapp(f, texto);\n  }\n  marcarEnviado(docId, via) {\n    if (!docId) return;\n    this.save({ deliveries: this.state.deliveries.map(d => d.id === docId ? { ...d, enviado: { via, ts: new Date().toISOString() } } : d) });\n  }\n  whatsapp(f, texto) {\n    const tel = (f.tel || '').replace(/\\D/g, '');\n    window.open('https://wa.me/' + (tel ? '34' + tel : '') + '?text=' + encodeURIComponent(texto), '_blank');\n  }\n  mesVistaDate() { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + (this.state.mesOffset || 0)); return d; }\n  esMesVista(iso) { const a = new Date(iso), b = this.mesVistaDate(); return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear(); }\n  fechaAeat(iso) { const d = new Date(iso); return String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear(); }\n  async sha256(txt) {\n    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase(); }\n    catch (e) { let h = 0; for (let i = 0; i < txt.length; i++) { h = (h * 31 + txt.charCodeAt(i)) | 0; } return ('DEMO' + Math.abs(h).toString(16)).toUpperCase(); }\n  }\n  async registro(d) {\n    const s = this.state, t = this.total(d);\n    const prev = [...s.deliveries].reverse().find(x => x.reg)?.reg?.h || '';\n    const ts = new Date().toISOString();\n    const cad = `Emisor=${s.empresa.nif}&Documento=${d.num}&Fecha=${this.fechaAeat(d.fecha)}&Importe=${t.toFixed(2)}&HuellaAnterior=${prev}&Generado=${ts}`;\n    return { h: await this.sha256(cad), prev, ts };\n  }\n\n  textoFactura(f) { return `${this.state.empresa.nombre} · Documento ${f.num} (${f.fecha})\\n${f.cliente}\\n${f.lineas.map(l => `${l.qty} × ${l.nombre} — ${l.sub}`).join('\\n')}\\nTOTAL ${f.total}\\nEstado: ${f.estado}\\nEl IVA se detalla en la factura.\\n¡Gracias!`; }\n  htmlFactura(f) {\n    const e = this.state.empresa, esc = (t) => String(t ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));\n    const S = 'scr' + 'ipt';\n    return `<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"utf-8\"><title>Factura ${esc(f.num)}<\u002Ftitle><style>body{font-family:-apple-system,system-ui,sans-serif;color:#2B1A21;margin:0;padding:40px;max-width:640px}h1{color:#E4185C;font-size:22px;margin:0}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{padding:10px 6px;border-bottom:1px solid #eee;text-align:left;font-size:14px}th{color:#7A646C;font-weight:600}.r{text-align:right}.tot{font-size:22px;font-weight:800}.g{color:#7A646C;font-size:13px;line-height:1.5}@media print{button{display:none}}<\u002Fstyle><\u002Fhead><body>\n<div style=\"display:flex;justify-content:space-between;gap:24px\"><div><h1>${esc(e.nombre)}<\u002Fh1><div class=\"g\">${esc(e.nif)}<br>${esc(e.direccion)}<\u002Fdiv><\u002Fdiv><div style=\"text-align:right\"><div class=\"g\">FACTURA<\u002Fdiv><div style=\"font-size:26px;font-weight:800\">${esc(f.num)}<\u002Fdiv><div class=\"g\">${esc(f.fecha)}<\u002Fdiv><div style=\"margin-top:6px;font-weight:700;color:${f.pagado ? '#1E9E5A' : '#D97706'}\">${f.estado}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:28px\"><div class=\"g\">Cliente<\u002Fdiv><div style=\"font-weight:800;font-size:16px\">${esc(f.cliente)}<\u002Fdiv><div class=\"g\">${esc(f.nif)}<br>${esc(f.direccion)}<\u002Fdiv><\u002Fdiv>\n<table><tr><th>Concepto<\u002Fth><th class=\"r\">Uds.<\u002Fth><th class=\"r\">Precio<\u002Fth><th class=\"r\">Importe<\u002Fth><\u002Ftr>${f.lineas.map(l => `<tr><td>${esc(l.nombre)}<\u002Ftd><td class=\"r\">${l.qty}<\u002Ftd><td class=\"r\">${l.precio}<\u002Ftd><td class=\"r\">${l.sub}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftable>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:14px;color:#7A646C\"><div>El IVA se detalla en la factura.<\u002Fdiv><div class=\"tot\" style=\"color:#2B1A21;margin-top:6px\">Total ${f.total}<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:32px;padding-top:16px;border-top:1px solid #eee;display:flex;gap:16px;align-items:flex-start\">\n  <div class=\"g\" style=\"flex:1\">\n    <div style=\"font-weight:800;color:#2B1A21;letter-spacing:1px\">SELLO DE INTEGRIDAD<\u002Fdiv>\n    <div>Sello interno del emisor para garantizar que este documento no se ha modificado.<\u002Fdiv>\n    <div>Huella del registro: <span style=\"font-family:ui-monospace,monospace;font-size:11px\">${(f.huella || '—').slice(0, 32)}<\u002Fspan><\u002Fdiv>\n    <div>Registro generado: ${f.regTs || '—'}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<button onclick=\"window.print()\" style=\"margin-top:32px;height:48px;padding:0 24px;border:0;border-radius:12px;background:#E4185C;color:#fff;font-size:16px;font-weight:700\">Guardar como PDF / Imprimir<\u002Fbutton>\n<${S}>setTimeout(function(){window.print()},400)<\u002F${S}><\u002Fbody><\u002Fhtml>`;\n  }\n  logoData() {\n    if (this._logo) return this._logo;\n    try { const img = document.getElementById('logo-src'); const c = document.createElement('canvas'); c.width = c.height = 300; const x = c.getContext('2d'); x.drawImage(img, 0, 0, 300, 300); this._logo = c.toDataURL('image/png'); } catch (e) { this._logo = null; }\n    return this._logo;\n  }\n  // Documento en PDF (A4) con logo, tabla y sello de integridad\n  pdfFactura(f, opts) {\n    const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: 'mm', format: 'a4' }), e = this.state.empresa;\n    const M
